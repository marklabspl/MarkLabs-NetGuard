[platformio]
default_envs = wt32_eth01

[env:wt32_eth01]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
board_build.f_cpu = 240000000L
board_build.flash_size = 4MB
board_build.partitions = default.csv
monitor_speed = 115200
upload_speed = 460800
build_flags =
  -D CORE_DEBUG_LEVEL=1
  -D CONFIG_ARDUHAL_LOG_COLORS=0
  ; The complete logic form has up to 252 URL-encoded fields. The ESP32 WebServer
  ; default of 32 silently discards the remainder.
  -D WEBSERVER_MAX_POST_ARGS=272
lib_deps =
  marian-craciunescu/ESP32Ping@^1.7
  knolleary/PubSubClient@^2.8
